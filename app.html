<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lestari Back Office</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
  <a class="visually-hidden-focusable skip-link" href="#main" data-i18n="Skip to content">Skip to content</a>

  <aside class="offcanvas-lg offcanvas-start sidebar" tabindex="-1" id="sidebar" aria-label="Main navigation" data-i18n-aria-label="Main navigation">
    <div class="sidebar-head">
      <a href="#/dashboard" class="brand"><span class="brand-mark"><i class="fa-solid fa-leaf"></i></span><span data-store-name>Lestari</span></a>
      <button type="button" class="btn-close btn-close-white d-lg-none" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Close menu" data-i18n-aria-label="Close menu"></button>
    </div>
    <div class="px-3 pb-2">
      <input type="search" class="form-control form-control-sm nav-search" placeholder="Find a menu…" data-i18n-placeholder="Find a menu…" data-nav-search aria-label="Find a menu" data-i18n-aria-label="Find a menu">
    </div>
    <nav class="sidebar-nav"><ul class="list-unstyled mb-4" data-nav></ul></nav>
  </aside>

  <div class="app-body">
    <header class="topbar">
      <button class="btn btn-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Open menu" data-i18n-aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <nav class="crumbs d-none d-md-block" aria-label="Breadcrumb" data-i18n-aria-label="Breadcrumb" data-breadcrumb></nav>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="dropdown" hidden>
          <button class="btn btn-light btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false"><i class="fa-solid fa-code-branch me-1"></i><span data-branch-label data-i18n="Branch">Branch</span></button>
          <ul class="dropdown-menu dropdown-menu-end" data-branches></ul>
        </div>
        <a href="#/notifications" class="btn btn-light btn-sm position-relative" aria-label="Notifications" data-i18n-aria-label="Notifications">
          <i class="fa-regular fa-bell"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger" data-badge hidden>0</span>
        </a>
        <div class="dropdown">
          <button class="btn btn-light btn-sm d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false">
            <img data-avatar class="avatar" alt="" hidden><i class="fa-solid fa-circle-user fs-5"></i>
            <span class="text-start d-none d-sm-block lh-sm"><span class="d-block fw-semibold small" data-user-name></span><span class="d-block text-muted" style="font-size:.72rem" data-user-role></span></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#/profile"><i class="fa-regular fa-user me-2"></i><span data-i18n="Profile">Profile</span></a></li>
            <li><a class="dropdown-item" href="#" data-change-password><i class="fa-solid fa-key me-2"></i><span data-i18n="Change password">Change password</span></a></li>
            <li><hr class="dropdown-divider"></li>
            <li><h6 class="dropdown-header" data-i18n="Language">Language</h6></li>
            <li><a class="dropdown-item" href="#" data-lang="en">English</a></li>
            <li><a class="dropdown-item" href="#" data-lang="id">Bahasa Indonesia</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#" data-logout><i class="fa-solid fa-arrow-right-from-bracket me-2"></i><span data-i18n="Sign out">Sign out</span></a></li>
          </ul>
        </div>
      </div>
    </header>
    <main id="main" class="app-main" tabindex="-1"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n/id.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/charts.js"></script>
  <script src="js/components/actions.js"></script>
  <script src="js/components/crud.js"></script>
  <script src="js/components/report.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/modules/_common.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/database.js"></script>
  <script src="js/modules/transactions.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/branches.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/commerce.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
