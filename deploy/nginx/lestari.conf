# Lestari back office — nginx example (tested with nginx 1.31).
#
# One host serves the static client and reverse-proxies the API, so the browser talks to a single origin:
#
#   https://backoffice.example.com/            → this repository (index.html, app.html, js/, css/, img/)
#   https://backoffice.example.com/api/v1/...  → lestari-backend on 127.0.0.1:8080
#   https://backoffice.example.com/uploads/... → uploaded images/PDFs (served by the backend)
#
# Install:
#   1. Copy the client to /var/www/lestari-client and set apiBaseUrl: '/api/v1' in js/config.js
#      (or keep config.js outside the web root — see "Runtime config" below).
#   2. Copy this file to /etc/nginx/conf.d/lestari.conf and snippets/lestari-proxy.conf to /etc/nginx/snippets/.
#   3. Replace backoffice.example.com and the certificate paths, then: nginx -t && systemctl reload nginx
#   4. Run the backend with PUBLIC_URL=https://backoffice.example.com (upload links use it).
#      CORS_ORIGINS is not needed: everything is same-origin.

upstream lestari_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Slow down password guessing on the sign-in endpoint (per client IP).
limit_req_zone $binary_remote_addr zone=lestari_login:10m rate=10r/m;

# HTTP → HTTPS (keeps the ACME path open for certbot renewals).
server {
    listen 80;
    listen [::]:80;
    server_name backoffice.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backoffice.example.com;

    ssl_certificate     /etc/letsencrypt/live/backoffice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backoffice.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:lestari_tls:10m;
    ssl_session_timeout 1d;

    root  /var/www/lestari-client;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Imports (XLSX/CSV) and uploads; keep in line with the backend's BODY_LIMIT_MB.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/csv;

    # Security headers. They are declared only here: an add_header inside a location would drop all of them there.
    # Passwords travel base64-encoded, which is not encryption — HTTPS (and HSTS) is what protects them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Bootstrap and Font Awesome load from cdn.jsdelivr.net; inline <style>/style="" is used by Bootstrap components.
    # Images may come from payment/loan partners, hence https: in img-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- static client ----
    # File names carry no content hash, so browsers revalidate every file (cheap 304s via ETag/Last-Modified).
    # The app routes with #/hash URLs, so no SPA fallback is needed.
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Runtime config: to keep config.js out of the deployed folder (so a new release never overwrites it),
    # uncomment and put the file at /etc/lestari/config.js.
    # location = /js/config.js {
    #     alias /etc/lestari/config.js;
    #     expires -1;
    # }

    # Developer tooling and dotfiles (.git, .env …) are not part of the site.
    location ^~ /tools/ {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # ---- API ----
    location /api/ {
        include snippets/lestari-proxy.conf;
    }

    location = /api/v1/auth/login {
        limit_req zone=lestari_login burst=5 nodelay;
        limit_req_status 429;
        include snippets/lestari-proxy.conf;
    }

    # ---- uploaded files ----
    # Upload names are random and never reused, so they can be cached for a long time.
    location /uploads/ {
        include snippets/lestari-proxy.conf;
        expires 30d;
    }
    # Faster alternative when nginx runs on the same machine as the backend: serve UPLOAD_DIR directly.
    # location /uploads/ {
    #     alias /var/lib/lestari/uploads/;
    #     expires 30d;
    # }
}
