# Shared reverse-proxy settings for lestari-backend (included by lestari.conf).
proxy_pass http://lestari_api;   # no URI part: /api/v1/... is passed through unchanged
proxy_http_version 1.1;
proxy_set_header Connection "";   # keep upstream connections alive
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;

# Reports, exports (XLSX/PDF) and imports can take a while.
proxy_connect_timeout 5s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
