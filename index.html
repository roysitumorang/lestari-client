<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Lestari Back Office</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7/css/all.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="login-card card">
      <div class="card-body p-4 p-md-5">
        <div class="brand brand-dark mb-4"><span class="brand-mark"><i class="fa-solid fa-leaf"></i></span><span>Lestari</span></div>
        <h1 class="h4 mb-1">Sign in to the back office</h1>
        <p class="text-muted small mb-4">Owner or staff account.</p>
        <div class="alert alert-danger small" role="alert" data-error hidden></div>
        <form data-login novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
              <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="btn btn-outline-secondary" type="button" data-toggle-pw aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
            </div>
          </div>
          <div class="mb-3" data-otp-box hidden>
            <label class="form-label" for="otp">Two-step verification code</label>
            <input class="form-control" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember_me" checked>
            <label class="form-check-label" for="remember">Keep me signed in</label>
          </div>
          <button class="btn btn-primary w-100" type="submit"><span data-label>Sign in</span></button>
        </form>
        <p class="small text-muted mt-4 mb-0">API: <code data-api></code></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core/api.js"></script>
  <script>
    (function () {
      const K = LESTARI_CONFIG.storageKeys;
      if (Api.store.get(K.token)) { location.replace('app.html'); return; }
      document.querySelector('[data-api]').textContent = LESTARI_CONFIG.apiBaseUrl;
      const form = document.querySelector('[data-login]');
      const err = document.querySelector('[data-error]');
      const otpBox = document.querySelector('[data-otp-box]');
      document.querySelector('[data-toggle-pw]').addEventListener('click', (e) => {
        const i = document.getElementById('password');
        i.type = i.type === 'password' ? 'text' : 'password';
        e.currentTarget.innerHTML = '<i class="fa-regular fa-eye' + (i.type === 'text' ? '-slash' : '') + '"></i>';
      });
      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        err.hidden = true;
        if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
        const btn = form.querySelector('button[type=submit]');
        btn.disabled = true;
        btn.querySelector('[data-label]').textContent = 'Signing in…';
        const body = { email: form.email.value.trim(), password: form.password.value, remember_me: form.remember_me.checked };
        if (!otpBox.hidden) body.otp = form.otp.value.trim();
        try {
          const r = (await Api.post('/auth/login', body)).data;
          Api.store.set(K.token, r.access_token);
          Api.store.set(K.refreshToken, r.refresh_token);
          Api.store.set(K.user, JSON.stringify(r.user || {}));
          location.replace('app.html');
        } catch (e) {
          if (e.code === 'two_factor_required') { otpBox.hidden = false; form.otp.focus(); err.textContent = 'Enter the code from your authenticator app.'; }
          else err.textContent = e.message;
          err.hidden = false;
        } finally {
          btn.disabled = false;
          btn.querySelector('[data-label]').textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
